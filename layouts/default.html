<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>

  <!-- Site stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1 class="name">{{ page.title | default: site.title }}</h1>

      <!-- Profile photo inserted below the title -->
      <img
        src="{{ '/assets/images/profile.jpg' | relative_url }}"
        alt="{{ page.title | default: site.title }} — profile photo"
        class="profile-photo"
      />

      <p class="tagline">{{ site.tagline }}</p>
    </div>
  </header>

  <main class="container resume">
    {{ content }}
  </main>

  <footer class="container footer">
    <p>James 1:12· <a href="https://github.com/Pauleegone/Pauleegone.github.io">Source</a></p>
  </footer>
</body>
</html>
